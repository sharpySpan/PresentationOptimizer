name: Build macOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon (M1 and newer)
            arch: arm64
          - runner: macos-13       # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -r requirements.txt pytest
          QT_QPA_PLATFORM=offscreen python -m pytest -q
      - name: Build
        run: PYTHON=python bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-macOS-${{ matrix.arch }}
          path: dist/Showrunner.dmg
