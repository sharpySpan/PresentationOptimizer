name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 and newer)
            arch: arm64
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pytest
      - name: Test
        shell: bash
        run: bash packaging/ci_test.sh
      - name: Build
        run: PYTHON=python bash packaging/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-macOS-${{ matrix.arch }}
          path: dist/Showrunner.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pytest
      - name: Test
        shell: bash
        run: bash packaging/ci_test.sh
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-Windows
          path: dist/Showrunner-Setup.exe

  linux:
    runs-on: ubuntu-22.04   # Older glibc = runs on more distros.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libpulse0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pytest
      - name: Test
        shell: bash
        run: bash packaging/ci_test.sh
      - name: Build
        run: PYTHON=python bash packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-Linux
          path: dist/Showrunner-linux-*.tar.gz
