name: Build installers

on:
  push:
    branches: [main]
    tags: ["v*"]   # Pushing a tag like v1.0.0 also publishes a GitHub release.
  workflow_dispatch:

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon (M1 and newer)
            arch: arm64
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pytest python-pptx
      - name: Test
        shell: bash
        run: QT_QPA_PLATFORM=offscreen bash packaging/ci_run.sh python -m pytest -q -rfE
      - name: Build
        run: PYTHON=python bash packaging/build_mac.sh
      - name: Self-test the built app
        run: bash packaging/ci_run.sh bash packaging/ci_selftest.sh dist/Showrunner.app/Contents/MacOS/Showrunner
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-macOS-${{ matrix.arch }}
          path: dist/Showrunner.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pytest python-pptx
      - name: Test
        shell: bash
        run: QT_QPA_PLATFORM=offscreen bash packaging/ci_run.sh python -m pytest -q -rfE
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Self-test the built app
        shell: bash
        run: bash packaging/ci_run.sh bash packaging/ci_selftest.sh dist/Showrunner/Showrunner.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-Windows
          path: dist/Showrunner-Setup.exe

  linux:
    strategy:
      fail-fast: false
      matrix:
        # x86: oldest runner = runs on more distros. ARM: Qt's ARM wheels need glibc 2.39 (Ubuntu 24.04+).
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libpulse0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt pytest python-pptx
      - name: Test
        shell: bash
        run: QT_QPA_PLATFORM=offscreen bash packaging/ci_run.sh python -m pytest -q -rfE
      - name: Build
        run: PYTHON=python bash packaging/build_linux.sh
      - name: Self-test the built app
        run: bash packaging/ci_run.sh bash packaging/ci_selftest.sh dist/Showrunner/Showrunner
      - uses: actions/upload-artifact@v4
        with:
          name: Showrunner-Linux-${{ matrix.runner }}
          path: dist/Showrunner-linux-*.tar.gz

  converter:
    # Downloads LibreOffice exactly like the app does and converts a real deck with it.
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, windows-latest, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxinerama1 libnss3 libcairo2 libcups2 libglib2.0-0 libdbus-1-3 libxrandr2 libsm6
      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt python-pptx pytest
      - name: Download LibreOffice and convert a deck
        shell: bash
        run: PYTHONPATH=. bash packaging/ci_run.sh python packaging/ci_converter_check.py
      - name: Every deck format through the real converter
        shell: bash
        run: QT_QPA_PLATFORM=offscreen bash packaging/ci_run.sh python -m pytest -q -rfEs tests/test_converters.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]   # The converter check reports but never blocks a release.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir release
          cp artifacts/Showrunner-macOS-arm64/Showrunner.dmg release/Showrunner-macOS-AppleSilicon.dmg
          cp artifacts/Showrunner-macOS-x86_64/Showrunner.dmg release/Showrunner-macOS-Intel.dmg
          cp artifacts/Showrunner-Windows/Showrunner-Setup.exe release/Showrunner-Windows-Setup.exe
          cp artifacts/Showrunner-Linux-*/*.tar.gz release/
          ls -l release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "Showrunner $GITHUB_REF_NAME" --notes-file packaging/release-notes.md
